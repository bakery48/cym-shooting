<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>回転砲塔</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-run">

<div id="app">
  <main id="stage">
    <canvas id="cv"></canvas>

    <div class="screen scroll" id="screen-select">
      <div class="inner">
        <h1>回転砲塔</h1>
        <p>
          ●▲■ はそれぞれ<b>同じ色の弾でしか壊れない</b>。<br>
          砲塔を一段回すと弾種が <b>●→▲→■→●</b> と変わる。射撃は常時オート。<br>
          <b>白い ◆</b> は色を持たないので、どの弾でも壊せる。そのぶん安い。<br>
          <b>白い枠</b>で囲われた敵はポッドの弾を弾くので、自機で撃つ。
        </p>
        <dl class="keys">
          <dt>移動</dt><dd>マウス / ドラッグ / <kbd>A</kbd><kbd>D</kbd> <kbd>←</kbd><kbd>→</kbd></dd>
          <dt>砲塔を回す</dt><dd>クリック / タップ / <kbd>Space</kbd> <kbd>W</kbd> <kbd>↑</kbd></dd>
          <dt>強化を買う</dt><dd>クリック / <kbd>1</kbd>〜<kbd>6</kbd></dd>
          <dt>中断</dt><dd><kbd>Esc</kbd> <kbd>P</kbd></dd>
          <dt>消音</dt><dd><kbd>M</kbd></dd>
        </dl>
        <div class="slot"></div>
        <div id="select-list"></div>
      </div>
    </div>

    <div id="options">
      <label class="opt"><input type="checkbox" id="opt-mute"> 消音 <kbd>M</kbd></label>
      <label class="opt">音量
        <input type="range" id="opt-volume" min="0" max="100" step="5" aria-label="音量">
      </label>
    </div>

    <div class="screen" id="screen-pause" hidden>
      <h1>中断中</h1>
      <div class="row">
        <button class="big" id="btn-resume">再開</button>
        <button class="big ghost" id="btn-quit">区を選ぶ</button>
      </div>
      <div class="slot"></div>
    </div>

    <div class="screen" id="screen-end" hidden>
      <h1 id="end-title">終了</h1>
      <p class="sub" id="end-stage"></p>
      <dl class="results" id="end-results"></dl>
      <div class="row">
        <button class="big" id="btn-next" hidden>次へ</button>
        <button class="big ghost" id="btn-again">もう一回</button>
        <button class="big ghost" id="btn-select">区を選ぶ</button>
      </div>
    </div>
  </main>

  <header id="hud">
    <div class="stat wide"><b id="hud-stage">―</b><span>区</span></div>
    <div class="stat"><b id="hud-time">3:00</b><span>のこり</span></div>
    <div class="stat money"><b id="hud-money">0</b><span>所持金</span></div>
    <div class="gaugewrap">
      <span id="hud-breachlabel">突破 0 / 10</span>
      <div class="gauge"><i id="hud-breachbar"></i></div>
    </div>
  </header>

  <div id="shop"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
