<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>回転砲塔 ― プロトタイプ</title>
<style>
  :root{
    --bg:#232a45; --bg-deep:#1b2038; --lane:#2b3357; --lane-edge:#3a4372;
    --ink:#dfe4f5; --ink-dim:#8b93b8;
    --c-circle:#ffb340; --c-tri:#45e0c8; --c-sq:#ff6b9d; --bad:#ff4d5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--bg-deep);color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex;flex-direction:column;height:100dvh;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  header{display:flex;align-items:center;gap:14px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;flex:none}
  .stat{display:flex;flex-direction:column;line-height:1}
  .stat b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat span{font-size:10px;color:var(--ink-dim);margin-top:4px}
  .stat.money b{color:var(--c-circle)}
  .gaugewrap{flex:1;display:flex;flex-direction:column;gap:5px}
  .gaugewrap span{font-size:10px;color:var(--ink-dim)}
  .gauge{height:6px;border-radius:3px;background:var(--lane);overflow:hidden}
  .gauge i{display:block;height:100%;width:0;background:var(--bad);transition:width .18s}

  #field{position:relative;flex:1;min-height:0;background:var(--bg);touch-action:none}
  canvas{display:block}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:26px;background:rgba(27,32,56,.93);text-align:center}
  .overlay.hide{display:none}
  .overlay h1{font-size:26px;font-weight:650;letter-spacing:-.02em}
  .overlay p{font-size:13px;color:var(--ink-dim);line-height:1.8;max-width:30em}
  .results{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:13px;font-variant-numeric:tabular-nums}
  .results dt{color:var(--ink-dim);text-align:right}
  .results dd{font-weight:600;text-align:left}
  button.big{font:inherit;font-size:15px;font-weight:600;color:var(--bg-deep);background:var(--c-tri);
    border:0;border-radius:100px;padding:12px 34px;cursor:pointer}
  button.big:focus-visible{outline:3px solid var(--c-circle);outline-offset:3px}

  #shop{flex:none;display:flex;gap:8px;overflow-x:auto;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg-deep);scrollbar-width:none}
  #shop::-webkit-scrollbar{display:none}
  .buy{flex:none;width:104px;min-height:62px;display:flex;flex-direction:column;justify-content:space-between;
    font:inherit;text-align:left;cursor:pointer;background:var(--lane);color:var(--ink);
    border:1px solid var(--lane-edge);border-radius:10px;padding:8px 9px}
  .buy .n{font-size:11.5px;font-weight:600;line-height:1.35}
  .buy .c{font-size:12px;font-variant-numeric:tabular-nums;color:var(--c-circle);font-weight:650}
  .buy:disabled{opacity:.36;cursor:default}
  .buy.owned{background:transparent;border-color:var(--c-tri);opacity:1}
  .buy.owned .c{color:var(--c-tri)}
  .buy.ready{border-color:var(--c-circle)}
  .buy:focus-visible{outline:2px solid var(--c-circle);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="stat"><b id="t">3:00</b><span>のこり</span></div>
  <div class="stat money"><b id="m">0</b><span>所持金</span></div>
  <div class="gaugewrap">
    <span id="misslabel">突破 0 / 10</span>
    <div class="gauge"><i id="missbar"></i></div>
  </div>
</header>

<div id="field">
  <canvas id="cv"></canvas>

  <div class="overlay" id="start">
    <h1>回転砲塔</h1>
    <p>指をずらして自機を動かす。撃つのは自動。<br>
       画面を軽くタップすると砲塔が一段回って弾の種類が変わる。<br>
       ●▲■ はそれぞれ同じ色の弾でしか壊れない。<br>
       白い装甲付きはポッドの弾を弾く。自機で撃つ。</p>
    <button class="big" id="go">はじめる</button>
  </div>

  <div class="overlay hide" id="end">
    <h1 id="endtitle">終了</h1>
    <dl class="results" id="res"></dl>
    <button class="big" id="again">もう一回</button>
  </div>
</div>

<div id="shop"></div>

<script>
/* ============================================================
   チューニング用
   ============================================================ */
const CONFIG = {
  runSeconds: 180,
  maxBreach: 10,               // 下まで抜けられる許容数

  kill:  { normal: 12, armored: 95 },
  armoredChance: { base: 0.05, perSec: 0.0004 },

  spawn: { start: 1.00, min: 0.30, rampPerSec: 0.0038 },
  fall:  { start: 46,   rampPerSec: 0.55 },   // px/秒（縦640px基準）

  ship:  { fireBase: 0.30, fireMin: 0.10, firePerLv: 0.035, bulletSpeed: 560 },
  pod:   { orbitRadius: 58, orbitSpeed: 0.9, fireMul: 1.9, bulletSpeed: 460, range: 520 },

  tapThreshold: 10,            // これ未満の移動なら「タップ＝砲塔回転」

  costs: {
    podCircle: 150, podTri: 260, podSq: 400,
    rate:   { base: 130, mul: 1.65, max: 5 },
    pierce: { base: 220, mul: 2.0,  max: 3 },
    spread: { base: 280, mul: 2.1,  max: 3 },
  },
};

/* ============================================================ */

const TYPES = ['circle','tri','sq'];
const COLOR = { circle:'#ffb340', tri:'#45e0c8', sq:'#ff6b9d' };
const MARK  = { circle:'●', tri:'▲', sq:'■' };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const field = document.getElementById('field');
const shopEl = document.getElementById('shop');
const elT = document.getElementById('t'), elM = document.getElementById('m');
const elBar = document.getElementById('missbar'), elLab = document.getElementById('misslabel');

let W=0, H=0, S=1, LINE=0;

function resize(){
  const r = field.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S = H/640;
  LINE = H - 74*Math.max(.85,S);      // 防衛ライン
}
addEventListener('resize', resize);

let G = null;

function newGame(){
  return {
    running:false, over:false,
    t:0, money:0, breach:0,
    ship:{ x:W/2, y:0, idx:0, ang:0, targetAng:0, cd:0 },
    enemies:[], bullets:[], parts:[],
    nextSpawn:.6, shake:0, flash:0,
    up:{ podCircle:false, podTri:false, podSq:false, rate:0, pierce:0, spread:0 },
    pods:[],
    st:{ ship:0, pod:0, armored:0, breach:0, earned:0 },
    drag:false, moved:0,
  };
}

const fireInterval = () => Math.max(CONFIG.ship.fireMin, CONFIG.ship.fireBase - G.up.rate*CONFIG.ship.firePerLv);
const podOwned = t => G.up[t==='circle'?'podCircle':t==='tri'?'podTri':'podSq'];

function syncPods(){
  const list = TYPES.filter(podOwned);
  G.pods = list.map((type,i) => {
    const old = G.pods.find(p=>p.type===type);
    return old || { type, a: i/list.length*6.2832, cd: Math.random()*.4 };
  });
  G.pods.forEach((p,i)=>{ if(p.a===undefined) p.a = i/G.pods.length*6.2832; });
}

/* ---------- ショップ ---------- */
const SHOP = [
  { id:'podCircle', name:'● ポッド', cost:()=>CONFIG.costs.podCircle, owned:()=>G.up.podCircle, buy:()=>{G.up.podCircle=true;syncPods();} },
  { id:'podTri',    name:'▲ ポッド', cost:()=>CONFIG.costs.podTri,    owned:()=>G.up.podTri,    buy:()=>{G.up.podTri=true;syncPods();} },
  { id:'podSq',     name:'■ ポッド', cost:()=>CONFIG.costs.podSq,     owned:()=>G.up.podSq,     buy:()=>{G.up.podSq=true;syncPods();} },
  { id:'rate',   name:'連射速度', lv:()=>G.up.rate,   max:CONFIG.costs.rate.max,
    cost:()=>Math.round(CONFIG.costs.rate.base*Math.pow(CONFIG.costs.rate.mul,G.up.rate)),   buy:()=>G.up.rate++ },
  { id:'pierce', name:'貫通弾',   lv:()=>G.up.pierce, max:CONFIG.costs.pierce.max,
    cost:()=>Math.round(CONFIG.costs.pierce.base*Math.pow(CONFIG.costs.pierce.mul,G.up.pierce)), buy:()=>G.up.pierce++ },
  { id:'spread', name:'拡散弾',   lv:()=>G.up.spread, max:CONFIG.costs.spread.max,
    cost:()=>Math.round(CONFIG.costs.spread.base*Math.pow(CONFIG.costs.spread.mul,G.up.spread)), buy:()=>G.up.spread++ },
];

const btns = SHOP.map(u=>{
  const b=document.createElement('button');
  b.className='buy'; b.innerHTML='<span class="n"></span><span class="c"></span>';
  b.onclick=()=>{
    if(!G||!G.running) return;
    const done = u.owned ? u.owned() : u.lv()>=u.max;
    if(done) return;
    const c=u.cost(); if(G.money<c) return;
    G.money-=c; u.buy(); paintShop(true);
  };
  shopEl.appendChild(b); return b;
});

let shopKey='';
function paintShop(force){
  const key=[G.money|0, JSON.stringify(G.up)].join('|');
  if(!force && key===shopKey) return;
  shopKey=key;
  SHOP.forEach((u,i)=>{
    const b=btns[i], done=u.owned?u.owned():u.lv()>=u.max, c=u.cost();
    b.querySelector('.n').textContent = u.name + (u.lv && !done ? ` Lv${u.lv()+1}` : '');
    b.querySelector('.c').textContent = done ? (u.owned?'稼働中':'MAX') : c;
    b.classList.toggle('owned',done);
    b.classList.toggle('ready',!done && G.money>=c);
    b.disabled = done || G.money<c;
  });
}

/* ---------- 生成 ---------- */
function spawn(){
  const armored = Math.random() < CONFIG.armoredChance.base + CONFIG.armoredChance.perSec*G.t;
  const type = TYPES[(Math.random()*3)|0];
  const r = 18*Math.max(.85,S);
  G.enemies.push({
    type, x: r*2 + Math.random()*(W - r*4), y: -r*2,
    r, hp: armored?3:1, armored, rot: Math.random()*6.28, hit:0,
  });
}

function shoot(x, y, type, from, extraSpread){
  const n = 1 + (from==='ship' ? G.up.spread : 0);
  const sp = (from==='ship'?CONFIG.ship.bulletSpeed:CONFIG.pod.bulletSpeed)*S;
  for(let i=0;i<n;i++){
    const off = n===1 ? 0 : (i-(n-1)/2)*0.13;
    G.bullets.push({
      x, y,
      vx: Math.sin(extraSpread+off)*sp, vy: -Math.cos(extraSpread+off)*sp,
      type, from, r: 4.5*Math.max(.85,S),
      pierce: from==='ship' ? G.up.pierce : 0,
    });
  }
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, sp=(50+Math.random()*180)*S;
    G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
  }
}

/* ---------- 入力 ---------- */
function px(e){ return e.clientX - cv.getBoundingClientRect().left; }
cv.addEventListener('pointerdown', e=>{
  if(!G||!G.running) return;
  cv.setPointerCapture(e.pointerId);
  G.drag=true; G.moved=0; G.lastX=px(e);
});
cv.addEventListener('pointermove', e=>{
  if(!G||!G.drag) return;
  const x=px(e);
  G.moved += Math.abs(x-G.lastX); G.lastX=x;
  G.ship.x = Math.max(24, Math.min(W-24, x));
});
function up(){
  if(!G||!G.drag) return;
  G.drag=false;
  if(G.moved < CONFIG.tapThreshold){          // タップ＝砲塔回転
    G.ship.idx = (G.ship.idx+1)%3;
    G.ship.targetAng += 2.0944;
  }
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

/* ---------- 更新 ---------- */
function update(dt){
  G.t += dt;
  const left = CONFIG.runSeconds - G.t;
  if(left<=0) return gameOver('時間切れ');
  if(G.breach>=CONFIG.maxBreach) return gameOver('防衛ライン崩壊');

  const sh=G.ship;
  sh.y = LINE - 34*Math.max(.85,S);
  sh.ang += (sh.targetAng - sh.ang) * Math.min(1, dt*14);

  // 自機の射撃
  sh.cd -= dt;
  if(sh.cd<=0){ shoot(sh.x, sh.y-16*S, TYPES[sh.idx], 'ship', 0); sh.cd = fireInterval(); }

  // ポッド
  for(const p of G.pods){
    p.a += CONFIG.pod.orbitSpeed*dt;
    p.x = sh.x + Math.cos(p.a)*CONFIG.pod.orbitRadius*Math.max(.85,S);
    p.y = sh.y + Math.sin(p.a)*CONFIG.pod.orbitRadius*Math.max(.85,S)*0.72;
    p.cd -= dt;
    if(p.cd<=0){
      let best=null, bd=CONFIG.pod.range*S;
      for(const e of G.enemies){
        if(e.type!==p.type || e.armored) continue;
        const d=Math.hypot(e.x-p.x, e.y-p.y);
        if(d<bd){ bd=d; best=e; }
      }
      if(best){
        const a=Math.atan2(best.x-p.x, -(best.y-p.y));
        shoot(p.x, p.y, p.type, 'pod', a);
        p.cd = fireInterval()*CONFIG.pod.fireMul;
      } else p.cd = 0.1;
    }
  }

  // 敵
  const fall=(CONFIG.fall.start+CONFIG.fall.rampPerSec*G.t)*S;
  const interval=Math.max(CONFIG.spawn.min, CONFIG.spawn.start-CONFIG.spawn.rampPerSec*G.t);
  G.nextSpawn-=dt; if(G.nextSpawn<=0){ spawn(); G.nextSpawn=interval; }

  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    e.y += fall*dt; e.rot += dt*(e.armored?1.6:0.5); e.hit=Math.max(0,e.hit-dt*5);
    if(e.y-e.r >= LINE){
      G.enemies.splice(i,1);
      G.breach++; G.st.breach++; G.shake=1; G.flash=1;
      burst(e.x, LINE, '#ff4d5e', 16);
    }
  }

  // 弾
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y<-20||b.x<-20||b.x>W+20){ G.bullets.splice(i,1); continue; }
    for(let j=G.enemies.length-1;j>=0;j--){
      const e=G.enemies[j];
      if(Math.hypot(e.x-b.x,e.y-b.y) > e.r+b.r) continue;

      if(e.type!==b.type){                       // 種類違い：弾かれる
        burst(b.x,b.y,'#7a86b8',4); G.bullets.splice(i,1); break;
      }
      if(e.armored && b.from==='pod'){           // 装甲：ポッドは通らない
        e.hit=1; burst(b.x,b.y,'#c9d2f0',5); G.bullets.splice(i,1); break;
      }
      e.hp--; e.hit=1;
      burst(b.x,b.y,COLOR[e.type],5);
      if(e.hp<=0){
        const v = e.armored?CONFIG.kill.armored:CONFIG.kill.normal;
        G.money+=v; G.st.earned+=v;
        if(e.armored) G.st.armored++;
        b.from==='ship' ? G.st.ship++ : G.st.pod++;
        burst(e.x,e.y,COLOR[e.type],e.armored?26:12);
        G.enemies.splice(j,1);
      }
      if(b.pierce>0 && b.from==='ship'){ b.pierce--; }
      else { G.bullets.splice(i,1); }
      break;
    }
  }

  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*S*dt; p.life-=dt*2.1;
    if(p.life<=0) G.parts.splice(i,1);
  }

  G.shake=Math.max(0,G.shake-dt*4); G.flash=Math.max(0,G.flash-dt*2.5);

  const mm=Math.floor(left/60), ss=Math.floor(left%60);
  elT.textContent = mm+':'+String(ss).padStart(2,'0');
  elM.textContent = Math.floor(G.money);
  elBar.style.width = (G.breach/CONFIG.maxBreach*100)+'%';
  elLab.textContent = `突破 ${G.breach} / ${CONFIG.maxBreach}`;
  paintShop();
}

/* ---------- 描画 ---------- */
function shapePath(type,x,y,r,rot){
  ctx.beginPath();
  if(type==='circle'){ ctx.arc(x,y,r,0,6.2832); return; }
  if(type==='tri'){
    for(let i=0;i<3;i++){
      const a=-Math.PI/2+i*2.0944+rot*0.15;
      const px=x+Math.cos(a)*r*1.16, py=y+Math.sin(a)*r*1.16;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    } ctx.closePath(); return;
  }
  const s=r*.88; ctx.roundRect(x-s,y-s,s*2,s*2,r*.28);
}

function draw(){
  const sx=G.shake?(Math.random()-.5)*9*G.shake:0, sy=G.shake?(Math.random()-.5)*9*G.shake:0;
  ctx.save(); ctx.translate(sx,sy);
  ctx.fillStyle='#232a45'; ctx.fillRect(-10,-10,W+20,H+20);

  // 防衛ライン
  ctx.strokeStyle='#4a5490'; ctx.lineWidth=1.5; ctx.setLineDash([7,7]);
  ctx.beginPath(); ctx.moveTo(0,LINE); ctx.lineTo(W,LINE); ctx.stroke(); ctx.setLineDash([]);
  const g=ctx.createLinearGradient(0,LINE,0,H);
  g.addColorStop(0,'rgba(74,84,144,.25)'); g.addColorStop(1,'rgba(74,84,144,0)');
  ctx.fillStyle=g; ctx.fillRect(0,LINE,W,H-LINE);

  // 敵
  for(const e of G.enemies){
    const c=COLOR[e.type];
    ctx.save();
    if(e.armored){ ctx.shadowColor='#e8edff'; ctx.shadowBlur=14; }
    if(e.hit){ ctx.shadowColor='#ffffff'; ctx.shadowBlur=18*e.hit; }
    ctx.fillStyle=c; shapePath(e.type,e.x,e.y,e.r,e.rot); ctx.fill();
    if(e.armored){
      ctx.strokeStyle='#e8edff'; ctx.lineWidth=2.5;
      shapePath(e.type,e.x,e.y,e.r*1.45,e.rot); ctx.stroke();
      ctx.fillStyle='#e8edff'; ctx.font='600 10px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillText(e.hp, e.x, e.y+3.5);
    }
    ctx.restore();
  }

  // 弾
  for(const b of G.bullets){
    ctx.fillStyle=COLOR[b.type];
    ctx.globalAlpha = b.from==='pod'?.85:1;
    ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r*.7,b.r*1.6,Math.atan2(b.vy,b.vx)-Math.PI/2,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ポッド
  for(const p of G.pods){
    ctx.save(); ctx.shadowColor=COLOR[p.type]; ctx.shadowBlur=12;
    ctx.fillStyle=COLOR[p.type];
    ctx.beginPath(); ctx.arc(p.x,p.y,7*Math.max(.85,S),0,6.2832); ctx.fill();
    ctx.restore();
  }

  // 自機
  const sh=G.ship, sc=Math.max(.85,S);
  ctx.save(); ctx.translate(sh.x,sh.y);
  ctx.fillStyle='#c9d2f0';
  ctx.beginPath();
  ctx.moveTo(0,-20*sc); ctx.lineTo(15*sc,14*sc); ctx.lineTo(0,7*sc); ctx.lineTo(-15*sc,14*sc);
  ctx.closePath(); ctx.fill();
  // 3連バレルのリング
  for(let i=0;i<3;i++){
    const a=sh.ang - i*2.0944 - Math.PI/2;
    const bx=Math.cos(a)*26*sc, by=Math.sin(a)*26*sc;
    const active = i===0 ? false : false;
    ctx.fillStyle=COLOR[TYPES[(sh.idx - i + 300)%3]];
    const isTop = Math.abs(Math.sin(a)+1) < .25 && Math.cos(a) > -0.5;
    ctx.globalAlpha = isTop?1:.45;
    ctx.beginPath(); ctx.arc(bx,by,(isTop?7:5)*sc,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // 現在の弾種
  ctx.fillStyle=COLOR[TYPES[sh.idx]];
  ctx.font=`600 ${13*sc}px system-ui,sans-serif`; ctx.textAlign='center';
  ctx.fillText(MARK[TYPES[sh.idx]], sh.x, H-14);

  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  if(G.flash>0){ ctx.fillStyle=`rgba(255,77,94,${G.flash*.16})`; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

/* ---------- ループ ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(!G) return;
  if(G.running) update(dt);
  if(!G.over) draw();
}
requestAnimationFrame(frame);

/* ---------- 開始 / 終了 ---------- */
const startEl=document.getElementById('start'), endEl=document.getElementById('end');
function begin(){
  resize(); G=newGame(); G.ship.x=W/2; G.running=true;
  startEl.classList.add('hide'); endEl.classList.add('hide');
  shopKey=''; paintShop(true);
}
function gameOver(reason){
  G.running=false; G.over=true;
  const s=G.st, total=s.ship+s.pod, rate=total?Math.round(s.pod/total*100):0;
  document.getElementById('endtitle').textContent=reason;
  document.getElementById('res').innerHTML=`
    <dt>撃破</dt><dd>${total}</dd>
    <dt>自機 / ポッド</dt><dd>${s.ship} / ${s.pod}（自動 ${rate}%）</dd>
    <dt>装甲付き</dt><dd>${s.armored}</dd>
    <dt>ライン突破</dt><dd>${s.breach}</dd>
    <dt>総収入</dt><dd>${Math.floor(s.earned)}</dd>`;
  endEl.classList.remove('hide');
}
document.getElementById('go').onclick=begin;
document.getElementById('again').onclick=begin;

resize(); G=newGame(); G.ship.x=W/2; paintShop(true); draw();
</script>
</body>
</html>
